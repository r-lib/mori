url: https://mori.r-lib.org
template:
  bootstrap: 5

  opengraph:
    image:
      src: https://raw.githubusercontent.com/r-lib/mori/main/dev/images/mori.png
      alt: "mori"

  includes:
    in_header: |
      <script src="https://cdn.jsdelivr.net/gh/posit-dev/supported-by-posit/js/badge.min.js" data-hide-below="1200" data-max-height="43" data-light-bg="#666f76" data-light-fg="#f9f9f9"></script>
      <script defer data-domain="mori.r-lib.org,all.tidyverse.org" src="https://plausible.io/js/plausible.js"></script>

development:
  mode: auto
news:
  releases:
  - text: "mori 0.2.0"
    href: https://opensource.posit.co/blog/2026-05-12_production-async-r/
  - text: "mori 0.1.0"
    href: https://opensource.posit.co/blog/2026-04-23_mori-0-1-0/
